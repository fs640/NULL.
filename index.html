<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="NULL. sneakers — limited streetwear footwear made for nowhere."
    />
    <title>NULL. — Made for Nowhere</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="site-header" id="site-header">
      <a class="logo" href="#home" aria-label="NULL home">NULL<span>.</span></a>
      <nav class="desktop-nav" aria-label="Main navigation">
        <a href="#collection">New Arrival</a>
        <button type="button" data-filter-link="men">Men’s</button>
        <button type="button" data-filter-link="women">Women’s</button>
        <button type="button" data-filter-link="kids">Kid’s</button>
      </nav>
      <div class="nav-actions">
        <button
          class="icon-button search-button"
          type="button"
          aria-label="Search products"
          aria-expanded="false"
          aria-controls="product-search-panel"
        >
          <img src="/assets/5988b.svg" alt="" />
        </button>
        <button class="icon-button cart-button" type="button" aria-label="Open cart">
          <img src="/assets/ba2f0.svg" alt="" />
          <span class="cart-count" aria-label="0 items in cart">0</span>
        </button>
        <button class="profile-button" type="button" aria-label="Account">
          <span class="profile-icon"><img src="/assets/76e1e.svg" alt="" /></span>
        </button>
        <button class="menu-button" type="button" aria-expanded="false" aria-controls="mobile-nav">
          Menu
        </button>
      </div>
      <nav class="mobile-nav" id="mobile-nav" aria-label="Mobile navigation">
        <a href="#collection">New Arrival</a>
        <button type="button" data-filter-link="men">Men’s</button>
        <button type="button" data-filter-link="women">Women’s</button>
        <button type="button" data-filter-link="kids">Kid’s</button>
      </nav>
      <form class="search-panel" id="product-search-panel" role="search">
        <label for="product-search">Find your next pair</label>
        <input id="product-search" type="search" placeholder="Search NULL. sneakers" autocomplete="off" />
        <button type="button" class="search-close" aria-label="Close search">Close</button>
      </form>
    </header>

    <main>
      <div id="storefront">
        <section class="hero" id="home" aria-labelledby="hero-title">
          <div class="hero-content">
            <p class="eyebrow">Edition 01 — SS 2026</p>
            <h1 id="hero-title">MADE FOR<br />NOWHERE.</h1>
            <a class="explore-button" href="#collection">
              <span>Explore Collection</span>
              <img src="/assets/35e86.svg" alt="" />
            </a>
          </div>
        </section>
      </div>
    </main>

        

    <div class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/script.js"></script>
  </body>
</html>
